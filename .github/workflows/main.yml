name: Build Foodzy APK and Signed AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Project & Build APK/AAB
      run: |
        cordova create foodzy_project com.foodzy.customerapp "Foodzy"
        cd foodzy_project

        rm -rf www/*
        rm -f config.xml

        cp ../index.html www/
        cp ../config.xml .

        cordova platform add android@13.0.0 --no-telemetry

        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

        # 1. Debug APK Build
        cordova build android --debug --no-telemetry -- --gradleArg=-Dorg.gradle.daemon=false

        # 2. Release AAB Build
        cordova build android --release --no-telemetry -- --packageType=bundle --gradleArg=-Dorg.gradle.daemon=false

    - name: Decode persisted upload keystore
      # This is the fix: instead of generating a brand-new random keystore
      # every run (which produced a different signing key each time and
      # broke Play Console uploads), we decode the SAME keystore every
      # single build from a GitHub Secret. That secret holds the exact
      # keystore Foodzy generated for you and whose certificate you already
      # submitted to Google for the "upload key reset".
      run: |
        cd foodzy_project/platforms/android/app/build/outputs/bundle/release/
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > foodzy_upload.keystore

    - name: Sign AAB with persisted keystore
      run: |
        cd foodzy_project/platforms/android/app/build/outputs/bundle/release/

        # Export the PEM certificate every run too — harmless, and handy if
        # you ever need to re-submit it to Google for any reason.
        keytool -export -rfc \
          -keystore foodzy_upload.keystore \
          -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          -file upload_certificate.pem \
          -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

        # Sign the AAB with the SAME persisted key every time
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore foodzy_upload.keystore \
          -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
          app-release.aab "${{ secrets.ANDROID_KEY_ALIAS }}"

    - name: Upload Signed AAB & PEM Certificate to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Foodzy-Signed-Builds
        path: |
          foodzy_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          foodzy_project/platforms/android/app/build/outputs/bundle/release/app-release.aab
          foodzy_project/platforms/android/app/build/outputs/bundle/release/upload_certificate.pem
