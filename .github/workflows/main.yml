name: Build Foodzy APK and Signed AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: |
        npm cache clean --force
        npm install -g cordova@13.0.0
        cordova -v

    - name: Create Project & Build APK/AAB
      run: |
        for i in 1 2 3; do
          cordova create foodzy_project com.foodzy.customerapp "Foodzy" && break
          echo "cordova create failed (attempt $i) — retrying in 10s..."
          rm -rf foodzy_project
          sleep 10
        done

        # 1. Root files ko foodzy_project ke andar copy karein (Pehle hi copy kar rahe hain taaki self-copy collision na ho)
        cp index.html foodzy_project/www/
        cp -r icons foodzy_project/www/ 2>/dev/null || true
        cp -r icons foodzy_project/ 2>/dev/null || true
        cp google-services.json foodzy_project/www/ 2>/dev/null || true
        cp google-services.json foodzy_project/ 2>/dev/null || true
        cp config.xml foodzy_project/

        cd foodzy_project

        cordova platform add android@13.0.0 --no-telemetry

        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

        # 1. Debug APK Build
        cordova build android --debug --no-telemetry -- --gradleArg=-Dorg.gradle.daemon=false

        # 2. Release AAB Build
        cordova build android --release --no-telemetry -- --packageType=bundle --gradleArg=-Dorg.gradle.daemon=false

    - name: Decode persisted upload keystore
      run: |
        cd foodzy_project/platforms/android/app/build/outputs/bundle/release/
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > foodzy_upload.keystore

    - name: Sign AAB with persisted keystore
      run: |
        cd foodzy_project/platforms/android/app/build/outputs/bundle/release/

        keytool -export -rfc \
          -keystore foodzy_upload.keystore \
          -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          -file upload_certificate.pem \
          -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore foodzy_upload.keystore \
          -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
          app-release.aab "${{ secrets.ANDROID_KEY_ALIAS }}"

    - name: Upload Signed AAB & PEM Certificate to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Foodzy-Signed-Builds
        path: |
          foodzy_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          foodzy_project/platforms/android/app/build/outputs/bundle/release/app-release.aab
          foodzy_project/platforms/android/app/build/outputs/bundle/release/upload_certificate.pem
          
